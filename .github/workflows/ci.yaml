name: Build

# Build on every branch push, tag push, and pull request change:
on: [push, pull_request_target]

jobs:
  build_repo:
    name: Build repo
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Install package requirements
      run: sudo apt-get install -y git make git build-essential binutils-mips-linux-gnu python3 python3-pip

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: build dependencies
      run: make dependencies

    - name: Get extra dependencies
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.WONDER_REPO }}
        token: ${{ secrets.WONDER_TOKEN }}
        path: wonder-secret

    - name: Get the dependency
      run: cp -r wonder-secret/baserom.jp.z64 ./

    - name: Compile
      run: make extract; make

    - name: Generate objdiff report
      run: python3 -m mapfile_parser objdiff_report report.json --version us

