name: Wonder Project J2 (Japanese)
sha1: 3a311ec0d77d4e0fc425a99cb6b9416f072e268e
options:
  basename: wonderprojectj2
  target_path: baserom.jp.z64
  elf_path: build/wonderprojectj2.elf
  base_path: .
  platform: n64
  compiler: IDO
  migrate_rodata_to_functions: True

  # asm_path: asm
  # src_path: src
  # build_path: build
  # create_asm_dependencies: True

  ld_script_path: wonderprojectj2.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  ld_sections_allowlist:
    - .shstrtab
    - .mdebug
    - .mdebug.abi32

  section_order: [".text", ".data", ".rodata", ".bss"]
  # auto_link_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - buggy_syms.txt
    - libultra_symbols.txt
    - symbol_addrs.txt
    - hardware_syms.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  # string_encoding: ASCII
  # data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  asset_path: bins
  # libultra_symbols: True
  # hardware_regs: True
  # gfx_ucode: # one of [f3d, f3db, f3dex, f3dexb, f3dex2]
segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: bin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm]

  - name: main
    type: code
    start: 0x1050
    vram: 0x80000450
    follows_vram: entry
    bss_size: 0xE82F0 # Previous size: C0C7C0
    subsegments:
      - [0x1050, c, sys/sys_main]
      - [0x1050, c, isprint]
      - [0x1050, c, crash_screen]
      - [0x3B20, c, code/code_3B20]
